name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  JAVA_VERSION: "17"
  # Ядро качается из релизов free-turn-proxy; токен - против anonymous rate limit API
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build-and-publish:
    name: Build signed APKs & publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Assemble release APKs
        run: |
          chmod +x gradlew
          # jniLibs живёт вне build/ (переживает clean) и не версионируется - чистим
          # руками перед каждым релизным билдом, чтобы туда не мог просочиться чужой
          # core от прошлого запуска. --no-build-cache - та же причина: релизная сборка
          # редкая, корректность важнее пары сэкономленных секунд.
          rm -rf app/src/main/jniLibs
          rm -rf "$HOME/.gradle/caches/freeturn-core"
          ./gradlew :app:assembleRelease --no-build-cache
          echo "::group::core sha256 after build"
          sha256sum app/src/main/jniLibs/*/libfreeturn.so
          echo "::endgroup::"

      # Имя ассета обязано содержать ABI - AppUpdater выбирает APK по Build.SUPPORTED_ABIS
      - name: Collect APKs
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a; do
            cp "app/build/outputs/apk/release/app-${abi}-release.apk" "dist/freeturn-${VERSION}-${abi}.apk"
          done

      # Родилось из инцидента 2026-08-09: собранный core внутри APK не совпадал с тем,
      # что fetchFreeturnCore реально скачал и зачекуммил - релиз ушёл без -hub-url.
      # Проверяем сам распакованный .so, а не то, что таск СКАЗАЛ, что скачал.
      - name: Verify bundled core actually supports -provider hub
        run: |
          for abi in arm64-v8a armeabi-v7a; do
            so="dist-check-${abi}.so"
            unzip -p "app/build/outputs/apk/release/app-${abi}-release.apk" "lib/${abi}/libfreeturn.so" > "$so"
            if ! strings "$so" | grep -q "hub-url"; then
              echo "::error::libfreeturn.so ($abi) в собранном APK не содержит -hub-url - core устарел или подменился"
              exit 1
            fi
          done

      - name: Upload assets to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.apk --clobber

  notify-telegram:
    name: Telegram announce
    runs-on: ubuntu-latest
    needs: build-and-publish
    steps:
      - name: Send release message
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "Telegram credentials not configured, skipping"
            exit 0
          fi

          BODY=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body -q .body | head -c 3000)
          URL=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json url -q .url)
          TAG="$GITHUB_REF_NAME"
          VER="${TAG#v}"
          ARM64_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/freeturn-${VER}-arm64-v8a.apk"
          ARMV7_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/freeturn-${VER}-armeabi-v7a.apk"

          # GH-markdown -> Telegram-HTML: сначала экранируем HTML, потом размечаем.
          # Хвосты "by @user in <PR-url>" из авто-нотов убираем - в посте это шум.
          HTML=$(printf '%s' "$BODY" \
            | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g' \
            | sed -E \
                -e 's| by @[[:alnum:]_-]+ in https://[^[:space:]]+||g' \
                -e 's|\[([^]]+)\]\((https?://[^)]+)\)|<a href="\2">\1</a>|g' \
                -e 's|\*\*([^*]+)\*\*|<b>\1</b>|g' \
                -e 's|`([^`]+)`|<code>\1</code>|g' \
                -e 's|^#{1,6}[[:space:]]+(.*)$|<b>\1</b>|' \
                -e 's|^[-*][[:space:]]+|- |')
          TEXT=$(printf '<b>FreeTurn %s</b>\n\n%s\n\n<b>Скачать:</b>\n- <a href="%s">arm64-v8a</a>\n- <a href="%s">armeabi-v7a</a>\n\n<a href="%s">Релиз на GitHub</a>' \
            "$TAG" "$HTML" "$ARM64_URL" "$ARMV7_URL" "$URL")

          EXTRA_ARGS=()
          if [ -n "$THREAD_ID" ]; then
            EXTRA_ARGS+=(--data-urlencode "message_thread_id=$THREAD_ID")
          fi

          send() {
            curl -fsS -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${CHAT_ID}" \
              "${EXTRA_ARGS[@]}" \
              --data-urlencode "text=$1" \
              --data-urlencode "parse_mode=${2:-}" \
              --data-urlencode "disable_web_page_preview=true" \
              -o /dev/null
          }
          # Кривой HTML роняет весь sendMessage - фолбэк plain text, чтобы анонс не пропал
          send "$TEXT" HTML || send "$(printf 'FreeTurn %s\n\n%s\n\nСкачать:\n- %s\n- %s\n\nРелиз: %s' "$TAG" "$BODY" "$ARM64_URL" "$ARMV7_URL" "$URL")"

          # Также пробуем отправить arm64 APK прямо файлом в тему, если размер позволяет (<50MB)
          mkdir -p /tmp/apk-dl
          if gh release download "$TAG" -p "*-arm64-v8a.apk" --repo "$GITHUB_REPOSITORY" -D /tmp/apk-dl 2>/dev/null; then
            APK_FILE=$(find /tmp/apk-dl -name "*.apk" | head -n 1)
            if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
              DOC_EXTRA_ARGS=()
              if [ -n "$THREAD_ID" ]; then
                DOC_EXTRA_ARGS+=(-F "message_thread_id=$THREAD_ID")
              fi
              curl -fsS -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
                -F "chat_id=${CHAT_ID}" \
                "${DOC_EXTRA_ARGS[@]}" \
                -F "document=@${APK_FILE}" \
                -F "caption=FreeTurn ${TAG} (arm64-v8a)" \
                -o /dev/null || true
            fi
          fi
